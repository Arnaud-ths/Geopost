<!--
  BLOC 12 — Bannière promo (code)
  ================================
  Usage : Boost sales variante prix — code promo affiché lisiblement avec
          date d'expiration et conditions.
  Tokens : {{PROMO_HEADLINE}} (ex. "-20% sur votre prochain envoi"),
           {{PROMO_CODE}}, {{PROMO_EXPIRES}} (ex. "31 août 2026"),
           {{PROMO_CONDITIONS_URL}}, {{COLOR_PRIMARY}}
  Conformité : contraste texte sur bgcolor ≥4.5:1 (vérifier selon {{COLOR_PRIMARY}}),
               conditions accessibles via lien, pas de FOMO countdown animé
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" class="bg-white" style="background:#ffffff;">
  <tr>
    <td class="pad-mobile" style="padding: 16px 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" bgcolor="{{COLOR_PRIMARY}}" style="background:{{COLOR_PRIMARY}}; border-radius:8px;">
        <tr>
          <td align="center" style="padding: 24px 16px;">
            <p style="margin:0 0 8px 0; font-family: Arial, Helvetica, sans-serif; font-size: 18px; font-weight: 700; color: #ffffff; line-height: 1.3;">
              {{PROMO_HEADLINE}}
            </p>
            <p style="margin:0 0 12px 0; font-family: 'Courier New', Courier, monospace; font-size: 28px; font-weight: 800; letter-spacing: 4px; color: #ffffff; line-height: 1; padding: 12px 24px; background: rgba(0,0,0,0.18); border-radius: 4px; display: inline-block;">
              {{PROMO_CODE}}
            </p>
            <p style="margin:0 0 4px 0; font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #ffffff; opacity: 0.9;">
              Valable jusqu'au {{PROMO_EXPIRES}}
            </p>
            <a href="{{PROMO_CONDITIONS_URL}}" target="_blank" style="font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #ffffff; text-decoration: underline; opacity: 0.85;">
              Voir les conditions
            </a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
