<!--
  BLOC 16 — Spacer / divider
  ===========================
  Usage : espacement vertical entre blocs OU divider visuel.
  Tokens : {{HEIGHT}} (px, défaut 24), {{DIVIDER}} (true → ligne, false → invisible)
  Conformité : table-based (Outlook), line-height + height + font-size synchros,
               role="presentation"
-->

<!-- Variante SPACER invisible -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" class="bg-white" style="background:#ffffff;">
  <tr>
    <td height="{{HEIGHT}}" style="height:{{HEIGHT}}px; line-height:{{HEIGHT}}px; font-size:1px;" aria-hidden="true">&nbsp;</td>
  </tr>
</table>
