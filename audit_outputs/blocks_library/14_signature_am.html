<!--
  BLOC 14 — Signature manuelle Account Manager (B2B Singular)
  ============================================================
  Usage : Singular emails B2B uniquement. Signature personnalisée
          avec photo (option), nom, rôle, téléphone direct, mailto.
  Tokens : {{AM_PHOTO_URL}} (optionnel — laisser vide si pas de photo),
           {{AM_NAME}}, {{AM_ROLE}}, {{AM_PHONE}}, {{AM_EMAIL}},
           {{BU_NAME}}
  Conformité : photo cropped 80×80, alt avec nom AM, mailto cliquable,
               téléphone format tel: pour mobile, contraste AA
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" class="bg-white" style="background:#ffffff;">
  <tr>
    <td class="pad-mobile" style="padding: 24px 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-top: 1px solid #e5e5e5; padding-top: 24px;" class="border-light">
        <tr>
          <td valign="top" width="80" style="width:80px; padding-right: 16px;">
            <img
              src="{{AM_PHOTO_URL}}"
              alt="{{AM_NAME}}"
              width="80"
              height="80"
              style="display:block; width:80px; height:80px; border:0; outline:none; border-radius:40px;"
            />
          </td>
          <td valign="top">
            <p class="text-dark" style="margin:0 0 2px 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; color: #1a1a1a;">
              {{AM_NAME}}
            </p>
            <p class="text-muted" style="margin:0 0 8px 0; font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #6b7280;">
              {{AM_ROLE}} · {{BU_NAME}}
            </p>
            <p style="margin:0 0 4px 0; font-family: Arial, Helvetica, sans-serif; font-size: 13px; color: #1a1a1a;">
              <a href="tel:{{AM_PHONE}}" style="color: #1a1a1a; text-decoration: none;">{{AM_PHONE}}</a>
            </p>
            <p style="margin:0; font-family: Arial, Helvetica, sans-serif; font-size: 13px;">
              <a href="mailto:{{AM_EMAIL}}" style="color: #1a1a1a; text-decoration: underline;">{{AM_EMAIL}}</a>
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
