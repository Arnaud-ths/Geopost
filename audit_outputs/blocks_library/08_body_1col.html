<!--
  BLOC 08 — Body 1 colonne (paragraphe)
  ======================================
  Usage : texte simple, 1 idée. Plusieurs blocs 08 empilables si plusieurs idées.
  Tokens : {{BODY_TEXT}} (peut contenir des <strong>, <em>, <a>)
  Contrainte : phrases ≤20 mots, 1 idée par bloc, ≤120 mots par bloc
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" class="bg-white" style="background:#ffffff;">
  <tr>
    <td class="pad-mobile" style="padding: 0 32px 16px 32px;">
      <p class="text-dark" style="margin:0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.6; color: #1a1a1a;">
        {{BODY_TEXT}}
      </p>
    </td>
  </tr>
</table>
