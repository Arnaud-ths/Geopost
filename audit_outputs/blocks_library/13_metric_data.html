<!--
  BLOC 13 — Data metric (B2B Singular)
  =====================================
  Usage : Singular email B2B — chiffres business, variation vs période précédente.
  Tokens : {{METRIC_1_VALUE}}, {{METRIC_1_LABEL}}, {{METRIC_1_DELTA}} (ex. "+12%"),
           {{METRIC_1_DELTA_POSITIVE}} (true/false → couleur verte/rouge),
           idem _2, _3
           {{COLOR_POSITIVE}} (vert, défaut #16a34a),
           {{COLOR_NEGATIVE}} (rouge, défaut #dc2626)
  Conformité : pas d'info via couleur seule (signe +/- présent), contraste AA,
               table-based pour Outlook, stack mobile
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" class="bg-white" style="background:#ffffff;">
  <tr>
    <td class="pad-mobile" style="padding: 8px 32px 16px 32px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border:1px solid #e5e5e5; border-radius:8px;" class="border-light">
        <tr>
          <!-- Metric 1 -->
          <td class="stack" align="center" valign="top" width="33%" style="width:33%; padding: 24px 12px; border-right: 1px solid #e5e5e5;">
            <p class="text-dark" style="margin:0 0 4px 0; font-family: Arial, Helvetica, sans-serif; font-size: 32px; font-weight: 800; color: #1a1a1a; line-height: 1;">
              {{METRIC_1_VALUE}}
            </p>
            <p style="margin:0 0 6px 0; font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: #6b7280;">
              {{METRIC_1_LABEL}}
            </p>
            <p style="margin:0; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; color: {{COLOR_POSITIVE}};">
              {{METRIC_1_DELTA}}
            </p>
          </td>
          <!-- Metric 2 -->
          <td class="stack" align="center" valign="top" width="33%" style="width:33%; padding: 24px 12px; border-right: 1px solid #e5e5e5;">
            <p class="text-dark" style="margin:0 0 4px 0; font-family: Arial, Helvetica, sans-serif; font-size: 32px; font-weight: 800; color: #1a1a1a; line-height: 1;">
              {{METRIC_2_VALUE}}
            </p>
            <p style="margin:0 0 6px 0; font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: #6b7280;">
              {{METRIC_2_LABEL}}
            </p>
            <p style="margin:0; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; color: {{COLOR_POSITIVE}};">
              {{METRIC_2_DELTA}}
            </p>
          </td>
          <!-- Metric 3 -->
          <td class="stack" align="center" valign="top" width="33%" style="width:33%; padding: 24px 12px;">
            <p class="text-dark" style="margin:0 0 4px 0; font-family: Arial, Helvetica, sans-serif; font-size: 32px; font-weight: 800; color: #1a1a1a; line-height: 1;">
              {{METRIC_3_VALUE}}
            </p>
            <p style="margin:0 0 6px 0; font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: #6b7280;">
              {{METRIC_3_LABEL}}
            </p>
            <p style="margin:0; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; color: {{COLOR_NEGATIVE}};">
              {{METRIC_3_DELTA}}
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
